<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mind Map Video Maker</title><style>
*{box-sizing:border-box}body{margin:0;background:#071321;color:#eef5ff;font:15px system-ui}header{padding:16px;border-bottom:1px solid #29405d}main{display:grid;grid-template-columns:350px 1fr;gap:14px;padding:14px;max-width:1300px;margin:auto}.panel{background:#102036;border:1px solid #29405d;border-radius:14px;padding:14px}h1{font-size:21px;margin:0}h2{font-size:16px}label{display:block;color:#b9c9dc;margin:10px 0 4px;font-size:13px}input,textarea{width:100%;padding:9px;border-radius:8px;border:1px solid #3a5575;background:#071321;color:white}textarea{min-height:55px}button{padding:10px;border:0;border-radius:8px;background:#f4ce57;font-weight:bold;margin:5px 3px 5px 0}.secondary{background:#304b6d;color:white}.node{border:1px solid #35506f;border-radius:9px;padding:9px;margin:9px 0}.stage{aspect-ratio:16/9;width:100%;background:#020812;border-radius:10px;overflow:hidden}canvas{width:100%;height:100%}.hint{font-size:12px;color:#a9bad0;line-height:1.5}@media(max-width:800px){main{grid-template-columns:1fr;padding:8px}}</style></head><body><header><h1>🧠 Animated Mind Map Video Maker</h1><small>Hindi explainer • Photos • Animated branches • 16:9</small></header><main><section class="panel"><h2>वीडियो सेटिंग्स</h2><label>मुख्य शीर्षक</label><input id="title" value="MLC चुनाव 2026"><label>सबटाइटल</label><input id="sub" value="महाराष्ट्र • कर्नाटक • उत्तर प्रदेश"><label>अवधि (सेकंड)</label><input id="duration" type="number" value="60" min="15" max="180"><div id="nodes"></div><button id="add">+ शाखा जोड़ें</button><button id="sample" class="secondary">नमूना रीसेट</button><hr><button id="play" class="secondary">▶ Preview</button><button id="export">⬇ वीडियो रिकॉर्ड करें</button><p class="hint" id="status">रिकॉर्डिंग WebM में डाउनलोड होगी। MP4 के लिए CapCut में खोलकर MP4 Export करें।</p></section><section class="panel"><h2>लाइव प्रीव्यू · 16:9</h2><div class="stage"><canvas id="c" width="1280" height="720"></canvas></div><button class="secondary" id="png">PNG इमेज सेव करें</button><p class="hint">फोटो अपलोड करें या image URL डालें। अगर URL वाली फोटो न दिखे तो उसे डिवाइस से अपलोड करें।</p></section></main><script>
const initial=[["MLC क्या है?","विधान परिषद का सदस्य • MLA से अलग","#a78bfa"],["महाराष्ट्र","महायुति की बढ़त • कांग्रेस को झटका","#fb557c"],["कर्नाटक","BJP–JDS का प्रदर्शन • कांग्रेस पर सवाल","#28c99a"],["उत्तर प्रदेश","वाराणसी और अयोध्या में BJP उम्मीदवारों की हार","#39a9ff"],["निष्कर्ष","स्थानीय मतदाता और क्षेत्रीय मुद्दे अहम","#f4c84a"]];
let data=initial.map(a=>({name:a[0],detail:a[1],color:a[2],src:"",img:null}));const $=x=>document.getElementById(x),c=$("c"),x=c.getContext("2d");let start=0;
function editors(){$("nodes").innerHTML="";data.forEach((n,i)=>{let d=document.createElement("div");d.className="node";d.innerHTML=`<b>शाखा ${i+1}</b><button data-del="${i}" style="float:right;background:#783b4b;color:white">हटाएँ</button><label>शीर्षक</label><input data-f="name" data-i="${i}" value="${n.name}"><label>जानकारी</label><textarea data-f="detail" data-i="${i}">${n.detail}</textarea><label>रंग</label><input type="color" data-f="color" data-i="${i}" value="${n.color}"><label>फोटो अपलोड</label><input type="file" accept="image/*" data-file="${i}"><label>या फोटो URL</label><input data-f="src" data-i="${i}" placeholder="https://..." value="${n.src}">`; $("nodes").append(d)})}
$("nodes").addEventListener("input",e=>{let i=+e.target.dataset.i,f=e.target.dataset.f;if(f!==undefined){data[i][f]=e.target.value;draw(99)}});
$("nodes").addEventListener("change",e=>{if(e.target.dataset.file!==undefined){let i=+e.target.dataset.file,r=new FileReader();r.onload=()=>{let im=new Image();im.onload=()=>{data[i].img=im;draw(99)};im.src=r.result};r.readAsDataURL(e.target.files[0])}});
$("nodes").addEventListener("click",e=>{if(e.target.dataset.del!==undefined){data.splice(+e.target.dataset.del,1);editors();draw(99)}});
$("add").onclick=()=>{data.push({name:"नई शाखा",detail:"अपनी जानकारी लिखें",color:"#38bdf8",src:"",img:null});editors();draw(99)};
$("sample").onclick=()=>{data=initial.map(a=>({name:a[0],detail:a[1],color:a[2],src:"",img:null}));editors();draw(99)};
function round(a,b,w,h,r,fill,stroke){x.beginPath();x.roundRect(a,b,w,h,r);x.fillStyle=fill;x.fill();x.strokeStyle=stroke;x.lineWidth=3;x.stroke()}
function draw(t=0){x.clearRect(0,0,1280,720);let g=x.createLinearGradient(0,0,1280,720);g.addColorStop(0,"#0b2039");g.addColorStop(1,"#020711");x.fillStyle=g;x.fillRect(0,0,1280,720);x.textAlign="center";x.fillStyle="#f6d66d";x.font="bold 48px system-ui";x.fillText($("title").value,640,75);x.fillStyle="#c5d5e8";x.font="24px system-ui";x.fillText($("sub").value,640,112);round(490,290,300,125,22,"#172f4d","#f4ce57");x.fillStyle="white";x.font="bold 36px system-ui";x.fillText("मुख्य विषय",640,365);let per=(Math.max(15,+$("duration").value||60)-5)/Math.max(1,data.length);data.forEach((n,i)=>{let a=-Math.PI/2+i*2*Math.PI/data.length,progress=Math.max(0,Math.min(1,(t-(5+i*per))/1.5));if(!progress)return;let px=640+Math.cos(a)*410,py=350+Math.sin(a)*220;x.globalAlpha=progress;x.strokeStyle=n.color;x.lineWidth=5;x.beginPath();x.moveTo(640+Math.cos(a)*150,350+Math.sin(a)*62);x.lineTo(px,py);x.stroke();round(px-150,py-68,300,136,17,"#10243b",n.color);x.fillStyle=n.color;x.font="bold 27px system-ui";x.fillText(n.name.slice(0,22),px,py-28);x.fillStyle="white";x.font="19px system-ui";x.fillText(n.detail.slice(0,34),px,py+2);if(n.img){x.save();x.beginPath();x.roundRect(px-42,py+12,84,43,6);x.clip();x.drawImage(n.img,px-42,py+12,84,43);x.restore()}x.globalAlpha=1});x.fillStyle="#90a8c5";x.font="17px system-ui";x.fillText("ANIMATED MIND MAP",640,690)}
function play(){let s=performance.now(),dur=Math.max(15,+$("duration").value||60);function f(now){let t=(now-s)/1000;draw(t);if(t<dur)requestAnimationFrame(f)}requestAnimationFrame(f)}
$("play").onclick=play;$("png").onclick=()=>{draw(99);let a=document.createElement("a");a.download="mind-map.png";a.href=c.toDataURL();a.click()};
$("export").onclick=()=>{let stream=c.captureStream(30),mime="video/webm";if(!window.MediaRecorder){$("status").textContent="इस ब्राउज़र में वीडियो रिकॉर्डिंग उपलब्ध नहीं है।";return}let rec=new MediaRecorder(stream,{mimeType:mime}),chunks=[];rec.ondataavailable=e=>chunks.push(e.data);rec.onstop=()=>{let u=URL.createObjectURL(new Blob(chunks,{type:mime})),a=document.createElement("a");a.href=u;a.download="MLC-mind-map.webm";a.click();$("status").textContent="वीडियो डाउनलोड हो गया! MP4 के लिए CapCut में Export करें।"};rec.start();$("status").textContent="रिकॉर्डिंग जारी है… टैब खुला रखें।";let s=performance.now(),dur=Math.max(15,+$("duration").value||60);function f(now){let t=(now-s)/1000;draw(t);if(t<dur)requestAnimationFrame(f);else rec.stop()}requestAnimationFrame(f)};
editors();draw(99);
</script></body></html>
